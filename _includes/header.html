<header class="site-header custom-header">
  <div class="nav-container">
    <!-- LEFT: monospace breadcrumb — r-rapuano.com/[slug] -->
    <div class="nav-left">
      <a href="{{ "/" | relative_url }}" class="brand">r-rapuano</a><span class="brand-ext">.com</span><span class="slug">/{{ page.slug | default: page.title | downcase }}</span>
    </div>

    <!-- RIGHT: social icons -->
    <div class="nav-right">
      {% for link in site.social_links %}
        {% if link.name == "email" %}
        <a
          href="#"
          class="social-link"
          data-eu="{{ site.email | split: '@' | first }}"
          data-ed="{{ site.email | split: '@' | last }}"
          data-tooltip="{{ link.name | upcase }}"
          rel="noopener"
        >
          <i class="{{ link.icon }} fa-fw"></i>
        </a>
        {% else %}
        <a
          href="{{ link.url }}"
          class="social-link"
          data-tooltip="{{ link.name | upcase }}"
          target="_blank" rel="noopener"
        >
          <i class="{{ link.icon }} fa-fw"></i>
        </a>
        {% endif %}
      {% endfor %}
    </div>
  </div>
</header>
